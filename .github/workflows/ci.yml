name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: easytier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EASYTIER_TEST_PG_DSN: postgres://postgres:postgres@127.0.0.1:5432/easytier_test?sslmode=disable
      EASYTIER_HTTPAPI_PG: postgres://postgres:postgres@127.0.0.1:5432/easytier_test?sslmode=disable
      EASYTIER_E2E_PG: postgres://postgres:postgres@127.0.0.1:5432/easytier_test?sslmode=disable
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test (PostgreSQL configured, nothing may skip)
        run: go test -count=1 ./...
      - name: client install
        working-directory: client
        run: npm ci --no-audit --no-fund
      - name: client build
        working-directory: client
        run: npm run build
      - name: contract, docs, readme, design and ui checks
        run: |
          set -euo pipefail
          node scripts/check-docs.mjs
          node scripts/check-readme.mjs
          node scripts/check-design-tokens.mjs
          node scripts/check-contrast.mjs
          node scripts/check-contract.mjs
          node scripts/check-ui.mjs
          node scripts/check-editor-invariants.mjs
