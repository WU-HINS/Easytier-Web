name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: easytier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EASYTIER_TEST_PG_DSN: postgres://postgres:postgres@127.0.0.1:5432/easytier_test?sslmode=disable
      EASYTIER_HTTPAPI_PG: postgres://postgres:postgres@127.0.0.1:5432/easytier_test?sslmode=disable
      EASYTIER_E2E_PG: postgres://postgres:postgres@127.0.0.1:5432/easytier_test?sslmode=disable
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test (PostgreSQL configured, nothing may skip)
        run: go test -count=1 ./...
      - name: tun capability (informational)
        # The data-plane checks need a tun device and CAP_NET_ADMIN. Report which
        # one is missing instead of letting a later step time out.
        run: |
          if ./scripts/tun-check.sh; then
            echo "tun available: data plane checks will run"
          else
            echo "::warning::data plane checks will skip: $(./scripts/tun-check.sh || true)"
          fi
      - name: client install
        working-directory: client
        run: npm ci --no-audit --no-fund
      - name: client unit tests
        run: cd client && npm test --silent
      - name: client build
        working-directory: client
        run: npm run build
      - name: contract, docs, readme, design and ui checks
        run: |
          set -euo pipefail
          node scripts/check-docs.mjs
          node scripts/check-readme.mjs
          node scripts/check-design-tokens.mjs
          node scripts/check-contrast.mjs
          node scripts/check-contract.mjs
          node scripts/check-i18n.mjs
          node scripts/check-features.mjs
          node scripts/check-errors.mjs
          node scripts/check-ui.mjs
          node scripts/check-editor-invariants.mjs

  ui-tour:
    # The console is a browser application; without this job nothing checks that the
    # pages render, that the ACL policy still compiles, or that the routes exist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: client install and build
        working-directory: client
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: playwright browser
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: tour every screen
        run: |
          set -euo pipefail
          go build -o /tmp/easytier-webd ./cmd/easytier-webd
          EASYTIER_SETUP_TOKEN=ci-token EASYTIER_DB_DRIVER=sqlite EASYTIER_DB_DSN=/tmp/tour.db EASYTIER_DB_BACKUP=0 \
            /tmp/easytier-webd --http 127.0.0.1:28201 --config-server 127.0.0.1:28202 --web-dir ./client/dist &
          for _ in $(seq 1 100); do curl -sf http://127.0.0.1:28201/healthz && break; sleep 0.3; done
          curl -fsS -X POST http://127.0.0.1:28201/api/v1/setup \
            -H "X-Setup-Token: ci-token" -H "Content-Type: application/json" \
            -d '{"username":"root-owner","password":"Real-Client-Pass-1"}'
          node scripts/ui-tour.mjs http://127.0.0.1:28201 docs/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-tour-screenshots
          path: docs/screenshots
          retention-days: 7

  data-plane:
    # The only job that proves packets cross the overlay. It needs two things the
    # default runner lacks: a tun device with CAP_NET_ADMIN, and the official
    # client. scripts/ci-tun-setup.sh handles the first; the second is fetched
    # from the pinned release below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: fetch the official client
        id: fetch
        run: |
          set -uo pipefail
          VERSION=v2.7.0
          URL="https://github.com/EasyTier/EasyTier/releases/download/$VERSION/easytier-linux-x86_64-$VERSION.zip"
          mkdir -p /tmp/et
          if ! curl -fsSL "$URL" -o /tmp/et/et.zip; then
            echo "::error::cannot download $URL; the data plane cannot be verified"
            exit 1
          fi
          unzip -q -o /tmp/et/et.zip -d /tmp/et
          BIN=$(find /tmp/et -name easytier-core -type f | head -n 1)
          if [ -z "$BIN" ]; then
            echo "::error::the release archive has no easytier-core"
            exit 1
          fi
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
          echo "found $BIN"
      - name: provision tun
        env:
          ET_BIN: ${{ steps.fetch.outputs.bin }}
        run: |
          set -uo pipefail
          if ! ./scripts/ci-tun-setup.sh; then
            echo "::error::this runner cannot provide a tun device; the data plane would go unverified"
            exit 1
          fi
      - name: overlay smoke
        env:
          ET_BIN: ${{ steps.fetch.outputs.bin }}
          ET_PEERS: tcp://v4v6.usvps.server.ddns.hinswu.top:21010
        run: |
          set -uo pipefail
          export PATH="$(dirname "$ET_BIN"):$PATH"
          set +e
          ./scripts/overlay-smoke.sh > /tmp/overlay-smoke.log 2>&1
          status=$?
          set -e
          tail -n 40 /tmp/overlay-smoke.log
          if [ "$status" -eq 3 ]; then
            echo "::error::the payload path could not be verified on this runner"
            exit 1
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-smoke-log
          path: /tmp/overlay-smoke.log
          retention-days: 7
          if-no-files-found: ignore
