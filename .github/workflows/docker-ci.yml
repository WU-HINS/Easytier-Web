name: docker-ci

# Every push publishes a CI image. The tag is literally CI, plus ci-<sha> to pin a
# commit. latest is never touched here: it belongs to the release workflow.
on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build ${{ matrix.arch }} on a native ${{ matrix.machine }} runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            machine: x86_64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            machine: aarch64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Assert the runner is the target architecture
        run: |
          set -euo pipefail
          got="$(uname -m)"
          want="${{ matrix.machine }}"
          if [ "$got" != "$want" ]; then
            echo "runner is $got but this entry wants $want; refusing to emulate" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the per-architecture CI image
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")/easytier-web"
          docker buildx build --platform "${{ matrix.platform }}" --tag "$image:ci-${{ matrix.arch }}" --label "org.opencontainers.image.revision=${{ github.sha }}" --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" --cache-from "type=gha,scope=ci-${{ matrix.arch }}" --cache-to "type=gha,mode=max,scope=ci-${{ matrix.arch }}" --push .

  manifest:
    name: publish CI as a multi-architecture tag
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge amd64 and arm64 under CI
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")/easytier-web"
          docker buildx imagetools create --tag "$image:CI" --tag "$image:ci-${GITHUB_SHA::7}" "$image:ci-amd64" "$image:ci-arm64"
          docker buildx imagetools inspect "$image:CI"
